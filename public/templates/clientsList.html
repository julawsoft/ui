<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Lista de Clientes</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
      font-size: 12px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #999;
      padding: 6px 8px;
      text-align: left;
      font-size: 11px;
    }

    th {
      background: #c3c3c3;
      color: #333;
      font-weight: bold;
    }

    tr:nth-child(even) {
      background: #f5f5f5;
    }

    .footer {
      margin-top: 20px;
      font-size: 10px;
      text-align: right;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Lista de Clientes</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Denominação</th>
        <th>Tipo</th>
        <th>NIF</th>
        <th>Pessoa Contato</th>
        <th>Email</th>
        <th>Data Registo</th>
      </tr>
    </thead>
    <tbody>
      {{rows}}
    </tbody>
  </table>

  <div class="footer">
    Julaw Soft - Gerado em: {{generated_at}}
  </div>
</body>
</html>
