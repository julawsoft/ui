version: '3'

services:
  app_sec_frontend:
    build: 
      context: ./
      dockerfile: Dockerfile
    image: app_sec_frontend
    container_name: app_sec_frontend
    env_file:
      - ./.env  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs:ro
      - ./crs:/etc/modsecurity/crs
      - ./modsecurity.conf:/etc/modsecurity/modsecurity.conf
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app_sec

networks:
  app_sec: 
    driver: bridge
