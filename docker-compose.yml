version: '3'

services:
  app_sec_frontend:
    build: 
      context: ./
      dockerfile: Dockerfile
    image: app_sec_frontend
    container_name: app_sec_frontend
    env_file:
      - ./.env  
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/modsec/modsecurity.conf:/etc/nginx/modsec/modsecurity.conf
      - ./nginx/modsec/crs-setup.conf:/etc/nginx/modsec/crs-setup.conf
      - ./nginx/modsec/rules:/etc/nginx/modsec/rules
      - ./ssl:/etc/ssl/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app_sec

networks:
  app_sec: 
    driver: bridge
