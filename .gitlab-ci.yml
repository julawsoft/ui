image: docker:17.05

stages:
  - build
  - analyse
  - deploy_dev
  - dynamic_scan
  - review
  - deploy_qa
  - deploy_prod

services:
  - docker:dind

include:
  - template: Code-Quality.gitlab-ci.yml

build:
  stage: build
  script:
    - echo "Building Application..."

code_quality:
  stage: analyse
  script:
    - echo "Check Code Quality"
  artifacts:
    paths: [gl-code-quality-report.json]

unit_test:
  image: node:16.13.2
  stage: analyse
  services:
    - docker:stable-dind
  variables:
    DOCKER_DRIVER: overlay2
  needs: [build]
  script:
    - echo "Testing Application..."
    - npm install --loglevel verbose
    - npm run test
  allow_failure: true

sast_sonarqube:
  image:
    name: sonarsource/sonar-scanner-cli:4
    entrypoint: [""]
  stage: analyse
  services:
    - name: docker:dind

  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    SONAR_TOKEN: $SONAR_TOKEN
    SONAR_HOST_URL: "https://9cd0-102-130-192-195.sa.ngrok.io"
    GIT_DEPTH: "0" # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - echo "SAST with SonarQube..."
    - sonar-scanner -Dsonar.qualitygate.wait=true -X
    - curl $SONAR_HOST_URL
  allow_failure: true
  only:
    - merge_requests
    - dev

deploy_dev:
  image:
    name: docker/compose:latest
    entrypoint: ["/bin/sh", "-c"]
  stage: deploy_dev
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
  script:
    - echo "Deploying in Development Environment"
    - docker-compose down
    - docker-compose build --no-cache
    - docker-compose up -d
  only:
    - dev

dynamic_scan:
  image:
    name: owasp/zap2docker-weekly
  stage: dynamic_scan
  services:
    - docker:dind
  needs: [deploy_dev]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    # URL to scan:
    DAST_WEBSITE: https://88d5-102-130-192-195.sa.ngrok.io
  script:
    - echo "Dynamic Scanning application"
    - mkdir /zap/wrk
    - zap.sh -cmd -quickurl $DAST_WEBSITE -quickprogress -quickout wrk/zap_report.xml
    - ls /zap/wrk
    - pwd
    - cp /zap/wrk/zap_report.xml /builds/cetim-dev/colabv2/colab-back-end
  artifacts:
    paths:
      - ./*.xml
  allow_failure: true
  only:
    - dev

gate:
  image: bioperl/bioperl
  stage: review
  script:
    - echo "Wait for manual go"
  allow_failure: false
  only:
    - master
  when: manual

deploy_qa:
  stage: deploy_qa
  needs: [gate]
  script:
    - echo "Deploying in Quality Enviroment..."
  only:
    - master
  when: manual

deploy_prod:
  stage: deploy_prod
  needs: [gate]
  script:
    - echo "Deploying in Production Enviroment"
  only:
    - master
  when: manual
